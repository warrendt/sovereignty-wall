<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070b12" />
    <title>Scan to join — Sovereignty</title>
    <link rel="stylesheet" href="/css/qr.css?v={{ASSET_VERSION}}" />
  </head>
  <body class="qr-page">
    <main class="qr-card">
      <h1 class="qr-title">Scan to add your answer</h1>
      <img
        class="qr-image"
        src="/qr.svg?v={{ASSET_VERSION}}"
        alt="QR code linking to {{SUBMIT_URL}}"
        width="640"
        height="640"
      />
      <p class="qr-url">{{SUBMIT_HOST}}/submit</p>
      <p class="qr-hint">Point your phone camera at the code.</p>
    </main>
  </body>
</html>
